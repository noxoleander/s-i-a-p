<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nox Oleander — Sublime in all Places</title>
<meta name="description" content="Nox Oleander — Sublime in all Places">
<style>
  :root{
    --letter-color:#ffe600;
  }
  *{ box-sizing:border-box; }
  html, body{
    margin:0;
    height:100%;
    overflow:hidden;
    background:#000;
  }

  /*
    FOND (au choix) :
    - pour une PHOTO : remplace background:#000; ci-dessous par
      background:#000 url('ta-photo.jpg') center center / cover no-repeat;
      (et tu peux alors supprimer la balise <video> dans le HTML)
    - pour une VIDÉO : laisse background:#000; ici et va voir
      la balise <video> juste en dessous dans le HTML.
  */
  #bg{
    position:fixed;
    inset:0;
    background:#000;
    z-index:0;
    overflow:hidden;
  }
  #bg video{
    position:absolute;
    top:50%; left:50%;
    min-width:100%; min-height:100%;
    width:auto; height:auto;
    transform:translate(-50%,-50%);
    object-fit:cover;
  }

  #stage{
    position:fixed;
    inset:0;
    z-index:1;
    overflow:hidden;
  }

  #portal{
    position:fixed;
    width:150px;
    height:90px;
    left:50%;
    top:50%;
    transform:translate(-50%, -50%);
    background:transparent;
    border:1px solid rgba(255,255,255,.8);
    z-index:1;
  }

  #secret-view, #view-yes, #view-no, #page-perf, #page-please,
  #page-artifact-1, #page-artifact-2, #page-artifact-3, #page-artifact-4{
    position:fixed;
    inset:0;
    z-index:3;
    background:#000;
    overflow:hidden;
    opacity:0;
    pointer-events:none;
    transition:opacity 1.1s;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }
  #secret-view video,
  #view-yes video,
  #view-no video,
  #page-perf video,
  #page-please video,
  #page-artifact-1 video,
  #page-artifact-2 video,
  #page-artifact-3 video,
  #page-artifact-4 video{
    position:absolute;
    top:50%; left:50%;
    min-width:100%; min-height:100%;
    width:auto; height:auto;
    transform:translate(-50%,-50%);
    object-fit:cover;
    z-index:0;
  }
  body.opened #stage,
  body.opened #portal{
    opacity:0;
    pointer-events:none;
    transition:opacity .8s;
  }
  body.v-secret #secret-view{ opacity:1; pointer-events:auto; }
  body.v-yes #view-yes{ opacity:1; pointer-events:auto; }
  body.v-no #view-no{ opacity:1; pointer-events:auto; }
  body.v-perf #page-perf{ opacity:1; pointer-events:auto; }
  body.v-please #page-please{ opacity:1; pointer-events:auto; }
  body.v-artifact-1 #page-artifact-1{ opacity:1; pointer-events:auto; }
  body.v-artifact-2 #page-artifact-2{ opacity:1; pointer-events:auto; }
  body.v-artifact-3 #page-artifact-3{ opacity:1; pointer-events:auto; }
  body.v-artifact-4 #page-artifact-4{ opacity:1; pointer-events:auto; }
  body.v-note #page-note{ opacity:1; pointer-events:auto; }

  #page-note{
    position:fixed;
    inset:0;
    z-index:3;
    opacity:0;
    pointer-events:none;
    transition:opacity 1.1s;
    /* remplace "img-note.jpg" par ton fichier si le nom/extension diffère */
    background:#000 url('img-note.jpg') center center / cover no-repeat;
  }
  .note-zone{
    position:absolute;
    cursor:pointer;
  }
  #note-zone-4{ left:7%;  top:2%;  width:26%; height:39%; }
  #note-zone-1{ left:68%; top:20%; width:10%; height:23%; }
  #note-zone-2{ left:30%; top:55%; width:30%; height:45%; }
  #note-zone-3{ left:78%; top:78%; width:14%; height:22%; }

  #img-autism{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%, -50%);
    max-width:50vw;
    max-height:50vh;
    z-index:2;
    display:none;
  }

  #page-perf .perf-hold-video{
    z-index:2;
    opacity:0;
    transition:none;
  }
  #page-perf .perf-hold-video.active{
    opacity:1;
  }

  #perf-intro{
    position:absolute;
    inset:0;
    z-index:5;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    opacity:1;
  }
  #perf-intro-text{
    margin:0;
    padding:0 2rem;
    text-align:center;
    font-family:Arial, sans-serif;
    font-weight:700;
    font-size:0.95rem;
    color:var(--letter-color);
    opacity:0;
  }
  #perf-intro-text.show{
    opacity:1;
  }

  #yes-img{
    position:relative;
    z-index:1;
    max-width:60vw;
    max-height:60vh;
    cursor:pointer;
    user-select:none;
    opacity:1;
    transition:opacity .8s;
  }

  .back-phrase{
    position:absolute;
    left:50%;
    top:78%;
    transform:translate(-50%, -50%);
    z-index:1;
    background:transparent;
    border:none;
    padding:0;
    font-family:Arial, sans-serif;
    font-weight:700;
    font-size:0.95rem;
    color:var(--letter-color);
    cursor:pointer;
    opacity:.85;
    transition:opacity .2s;
    display:none;
    text-align:center;
  }
  .back-phrase:hover{ opacity:1; }
  #perf-please-msg{
    z-index:6;
  }

  .options{
    position:absolute;
    left:50%;
    top:78%;
    transform:translate(-50%, -50%);
    z-index:1;
    display:flex;
    gap:3.5rem;
    opacity:0;
    pointer-events:none;
  }
  .options.show{
    opacity:1;
    pointer-events:auto;
  }
  .opt{
    background:transparent;
    border:none;
    padding:0;
    font-family:Arial, sans-serif;
    font-weight:700;
    font-size:0.95rem;
    color:var(--letter-color);
    cursor:pointer;
    opacity:.85;
    transition:opacity .2s;
  }
  .opt:hover{ opacity:1; }

  #secret-view .back,
  #view-yes .back,
  #view-no .back,
  #page-perf .back,
  #page-please .back,
  #page-artifact-1 .back,
  #page-artifact-2 .back,
  #page-artifact-3 .back,
  #page-artifact-4 .back,
  #page-note .back{
    position:absolute;
    bottom:0; left:0;
    z-index:1;
  }

  #please-artifacts{
    position:absolute;
    inset:0;
    z-index:3;
    display:none;
    pointer-events:none;
  }
  #please-artifacts.show{
    display:block;
  }
  .artifact-item{
    position:absolute;
    height:80px;
    width:auto;
    cursor:pointer;
    pointer-events:auto;
  }
  #page-please .artifact-item video{
    position:static;
    display:block;
    min-width:0;
    min-height:0;
    width:auto;
    height:80px;
    transform:none;
    object-fit:initial;
  }
  #artifact-4{ top:22%;  left:50%; transform:translate(-50%, 0); }
  #artifact-3{ bottom:22%; left:50%; transform:translate(-50%, 0); }
  #artifact-1{ left:18%;  top:50%; transform:translate(0, -50%); }
  #artifact-2{ right:18%; top:50%; transform:translate(0, -50%); }

  #please-messages{
    position:absolute;
    inset:0;
    z-index:2;
    pointer-events:none;
  }
  .please-msg{
    position:absolute;
    transform:translate(-50%, -50%);
    margin:0;
    font-family:Arial, sans-serif;
    font-weight:700;
    font-size:0.95rem;
    color:var(--letter-color);
    text-align:center;
    max-width:55vw;
  }

  a.back{
    margin:1.4rem;
    font-family:Arial, sans-serif;
    font-size:.7rem;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--letter-color);
    text-decoration:none;
    opacity:.6;
    transition:opacity .2s;
  }
  a.back:hover{ opacity:1; }

  #sound-toggle{
    position:fixed;
    bottom:1.2rem;
    right:1.2rem;
    z-index:10;
    background:transparent;
    border:1px solid rgba(255,255,255,.4);
    color:#fff;
    font-family:Arial, sans-serif;
    font-size:.65rem;
    letter-spacing:.08em;
    text-transform:uppercase;
    padding:.4rem .7rem;
    cursor:pointer;
    opacity:.5;
    transition:opacity .2s;
  }
  #sound-toggle:hover{ opacity:1; }

  .letter{
    position:absolute;
    top:0; left:0;
    font-family:Arial, sans-serif;
    font-weight:700;
    font-size:0.95rem;
    color:var(--letter-color);
    user-select:none;
    pointer-events:auto;
    cursor:grab;
    will-change:transform;
    line-height:1;
  }
  .letter.dragging{
    cursor:grabbing;
    z-index:5;
  }

  @media (prefers-reduced-motion: reduce){
    .letter{ transition:none; }
  }
</style>
</head>
<body>

<div id="bg">
  <!--
    VIDÉO DE FOND :
    remplace "ta-video.mp4" par le nom de ton fichier vidéo,
    placé dans le même dossier que ce fichier html.
    muted + autoplay + loop = elle démarre et boucle toute seule,
    sans son (le son de la vidéo elle-même reste coupé,
    ça n'a pas de rapport avec le bouton "son" du site).
  -->
  <video autoplay muted loop playsinline>
    <source src="ta-video.mp4" type="video/mp4">
  </video>
</div>
<div id="portal"></div>
<div id="stage"></div>

<button id="sound-toggle" type="button">son : off</button>

<!--
  BOUCLE SONORE — PAGE D'ACCUEIL :
  remplace la valeur "src" ci-dessous par le nom de ton fichier audio
  (mp3 ou ogg), placé dans le même dossier que ce fichier html.
  Le son se lance au premier clic/drag sur la page (contrainte des
  navigateurs : impossible de jouer du son avant une interaction).
-->
<audio id="bgm-home" loop preload="auto">
  <source src="ta-boucle.mp3" type="audio/mpeg">
</audio>

<!--
  BOUCLE SONORE — PAGE "YES / NO" :
  même principe, fichier différent. Elle prend le relais
  automatiquement quand on arrive sur cette page, et la boucle
  d'accueil se coupe.
-->
<audio id="bgm-secret" loop preload="auto">
  <source src="boucle-page2.mp3" type="audio/mpeg">
</audio>

<!--
  BOUCLE SONORE — PAGE "YES" (2.1) :
  même principe, encore un fichier différent. Elle prend le relais
  dès qu'on clique sur "yes".
-->
<audio id="bgm-yes" loop preload="auto">
  <source src="boucle-yes.mp3" type="audio/mpeg">
</audio>

<!--
  BOUCLE SONORE — "PAGE PERF" :
  se lance juste après le 5ème clic sur l'image de la page "yes",
  en coupant net la boucle précédente (pas de fondu).
-->
<audio id="bgm-perf" loop preload="auto">
  <source src="boucle-perf.mp3" type="audio/mpeg">
</audio>

<!--
  EFFETS SONORES — dépôt d'une lettre dans la boîte :
  remplace ces 5 noms par tes fichiers .mp3 (courts).
  Si tu en as moins de 5, tu peux réutiliser les mêmes fichiers
  sur plusieurs emplacements — ça marche très bien aussi.
  Un des cinq est choisi au hasard à chaque lettre posée.
-->
<audio id="sfx-1" preload="auto"><source src="sfx-pose-1.mp3" type="audio/mpeg"></audio>
<audio id="sfx-2" preload="auto"><source src="sfx-pose-2.mp3" type="audio/mpeg"></audio>
<audio id="sfx-3" preload="auto"><source src="sfx-pose-3.mp3" type="audio/mpeg"></audio>
<audio id="sfx-4" preload="auto"><source src="sfx-pose-4.mp3" type="audio/mpeg"></audio>
<audio id="sfx-5" preload="auto"><source src="sfx-pose-5.mp3" type="audio/mpeg"></audio>

<!--
  SONS — image cliquable de la page "yes" :
  un son différent pour chacune des 5 images, dans l'ordre.
-->
<audio id="yes-click-1" preload="auto"><source src="yes-click-1.mp3" type="audio/mpeg"></audio>
<audio id="yes-click-2" preload="auto"><source src="yes-click-2.mp3" type="audio/mpeg"></audio>
<audio id="yes-click-3" preload="auto"><source src="yes-click-3.mp3" type="audio/mpeg"></audio>
<audio id="yes-click-4" preload="auto"><source src="yes-click-4.mp3" type="audio/mpeg"></audio>
<audio id="yes-click-5" preload="auto"><source src="yes-click-5.mp3" type="audio/mpeg"></audio>

<div id="secret-view">
  <!--
    VIDÉO DE FOND DE CETTE VUE :
    remplace "video-suite.mp4" par le nom de ton fichier vidéo.
  -->
  <video autoplay muted loop playsinline>
    <source src="video-suite.mp4" type="video/mp4">
  </video>
  <div class="options" id="yesno-options">
    <button type="button" class="opt" id="opt-yes">yes</button>
    <button type="button" class="opt" id="opt-no">no</button>
  </div>
  <a class="back" href="#" id="back-link">← retour</a>
</div>

<div id="view-yes">
  <!--
    VIDÉO DE FOND — page "yes" (2.1) :
    remplace "video-yes.mp4" par le nom de ton fichier vidéo.
  -->
  <video autoplay muted loop playsinline>
    <source src="video-yes.mp4" type="video/mp4">
  </video>
  <!--
    IMAGE CLIQUABLE — remplace yes-img-1.png à yes-img-5.png
    par tes 5 images.
  -->
  <img id="yes-img" src="yes-img-1.png" alt="">
  <button type="button" class="back-phrase" id="yes-undo">sorry, didn't mean to do that.</button>
  <a class="back" href="#" id="back-link-yes">← retour</a>
</div>

<div id="view-no">
  <!--
    VIDÉO DE FOND — page "no" (2.2) :
    remplace "video-no.mp4" par le nom de ton fichier vidéo.
  -->
  <video autoplay muted loop playsinline>
    <source src="video-no.mp4" type="video/mp4">
  </video>
  <a class="back" href="#" id="back-link-no">← retour</a>
</div>

<div id="page-perf">
  <!--
    VIDÉO DE FOND (avec son) — "page perf" :
    remplace "video-perf.mp4" par ton fichier.
    Pas de "muted" ici : c'est volontaire, tu veux le son de cette vidéo.
    Pas d'"autoplay" non plus : elle démarre au clic qui ferme l'intro.
  -->
  <video id="perf-bg-video" loop playsinline>
    <source src="video-perf.mp4" type="video/mp4">
  </video>
  <!--
    4 VIDÉOS "CLIC MAINTENU" — remplace video-perf-hold-1.mp4 à
    video-perf-hold-4.mp4 par tes fichiers. Une est choisie au hasard
    à chaque nouveau clic, et s'affiche brutalement (sans fondu)
    par-dessus la vidéo de fond, aux mêmes dimensions. Muettes par
    défaut ; dis-moi si tu veux aussi du son dessus.
  -->
  <video class="perf-hold-video" id="perf-hold-1" muted loop playsinline preload="auto"><source src="video-perf-hold-1.mp4" type="video/mp4"></video>
  <video class="perf-hold-video" id="perf-hold-2" muted loop playsinline preload="auto"><source src="video-perf-hold-2.mp4" type="video/mp4"></video>
  <video class="perf-hold-video" id="perf-hold-3" muted loop playsinline preload="auto"><source src="video-perf-hold-3.mp4" type="video/mp4"></video>
  <video class="perf-hold-video" id="perf-hold-4" muted loop playsinline preload="auto"><source src="video-perf-hold-4.mp4" type="video/mp4"></video>

  <!--
    SON — pendant le clic maintenu : boucle qui ne joue que tant que
    le clic est enfoncé, et démarre à un point aléatoire de la boucle
    à chaque nouvelle pression.
  -->
  <audio id="perf-hold-sound" loop preload="auto"><source src="son-hold.mp3" type="audio/mpeg"></audio>

  <div id="perf-intro">
    <p id="perf-intro-text">I think there's someone in the garden</p>
  </div>

  <button type="button" class="back-phrase" id="perf-please-msg">If you want him to go away, you're gonna have to say "please".</button>

  <a class="back" href="#" id="back-link-perf">← retour</a>
</div>

<div id="page-please">
  <!--
    VIDÉO DE FOND — "page please" :
    remplace "video-please.mp4" par ton fichier, ou supprime
    la balise si tu ne veux pas de vidéo ici.
  -->
  <video autoplay muted loop playsinline>
    <source src="video-please.mp4" type="video/mp4">
  </video>
  <div id="please-messages"></div>

  <!--
    4 VIDÉOS "ARTFACT" — remplace artfact-1.mp4 à artfact-4.mp4 par tes
    fichiers. Elles apparaissent toutes les 4 après la 7ème phrase,
    chacune joue en boucle avec son propre son, indépendamment des autres.
    Cliquer sur l'une d'elles ouvre sa page dédiée.
  -->
  <!--
    SON SUPPLÉMENTAIRE — se joue une fois, au moment où les 4 vidéos
    "artfact" apparaissent (en plus du son propre à chaque vidéo).
    Remplace "son-artfacts.mp3" par ton fichier.
  -->
  <audio id="artifacts-reveal-sound" preload="auto"><source src="son-artfacts.mp3" type="audio/mpeg"></audio>

  <div id="please-artifacts">
    <div class="artifact-item" id="artifact-4"><video loop playsinline><source src="artfact-4.mp4" type="video/mp4"></video></div>
    <div class="artifact-item" id="artifact-3"><video loop playsinline><source src="artfact-3.mp4" type="video/mp4"></video></div>
    <div class="artifact-item" id="artifact-1"><video loop playsinline><source src="artfact-1.mp4" type="video/mp4"></video></div>
    <div class="artifact-item" id="artifact-2"><video loop playsinline><source src="artfact-2.mp4" type="video/mp4"></video></div>
  </div>

  <a class="back" href="#" id="back-link-please">← retour</a>
</div>

<div id="page-artifact-1">
  <!-- VIDÉO DE FOND — page de l'artfact 1 : remplace "video-artifact-1.mp4" -->
  <video autoplay muted loop playsinline><source src="video-artifact-1.mp4" type="video/mp4"></video>
  <a class="back" href="#" id="back-link-artifact-1">← retour</a>
</div>
<div id="page-artifact-2">
  <!-- VIDÉO DE FOND — page de l'artfact 2 : remplace "video-artifact-2.mp4" -->
  <video autoplay muted loop playsinline><source src="video-artifact-2.mp4" type="video/mp4"></video>
  <a class="back" href="#" id="back-link-artifact-2">← retour</a>
</div>
<div id="page-artifact-3">
  <!-- VIDÉO DE FOND — page de l'artfact 3 : remplace "video-artifact-3.mp4" -->
  <video autoplay muted loop playsinline><source src="video-artifact-3.mp4" type="video/mp4"></video>
  <a class="back" href="#" id="back-link-artifact-3">← retour</a>
</div>
<div id="page-artifact-4">
  <!-- VIDÉO DE FOND — page de l'artfact 4 : remplace "video-artifact-4.mp4" -->
  <video autoplay muted loop playsinline><source src="video-artifact-4.mp4" type="video/mp4"></video>
  <a class="back" href="#" id="back-link-artifact-4">← retour</a>
</div>

<div id="page-note">
  <!--
    IMAGE DE FOND — "img-note" : remplace "img-note.jpg" (dans le CSS
    plus haut, règle #page-note) par ton fichier si le nom diffère.

    4 ZONES CLIQUABLES invisibles, positionnées sur les 4 photos :
    note-zone-4 (personne, haut-gauche)   -> son note-4
    note-zone-1 (CD, haut-droite)         -> son note-1
    note-zone-2 (tunnel, bas-gauche)      -> son note-2
    note-zone-3 (arbre, bas-droite)       -> son note-3
    Cliquer dans l'ordre note-1 > note-2 > note-3 > note-4 révèle
    "img-autism" au centre. Un autre ordre ne fait rien.
  -->
  <div class="note-zone" id="note-zone-1" data-note="note-1"></div>
  <div class="note-zone" id="note-zone-2" data-note="note-2"></div>
  <div class="note-zone" id="note-zone-3" data-note="note-3"></div>
  <div class="note-zone" id="note-zone-4" data-note="note-4"></div>

  <audio id="sound-note-1" preload="auto"><source src="note-1.mp3" type="audio/mpeg"></audio>
  <audio id="sound-note-2" preload="auto"><source src="note-2.mp3" type="audio/mpeg"></audio>
  <audio id="sound-note-3" preload="auto"><source src="note-3.mp3" type="audio/mpeg"></audio>
  <audio id="sound-note-4" preload="auto"><source src="note-4.mp3" type="audio/mpeg"></audio>

  <!-- remplace "img-autism.jpg" par ton fichier -->
  <img id="img-autism" src="img-autism.jpg" alt="">

  <a class="back" href="#" id="back-link-note">← retour</a>
</div>

<script>
(function(){
  var word = "SUBLIME IN ALL PLACES SUBLIME IN ALL PLACES SUBLIME IN ALL PLACES";
  var chars = word.split('').filter(function(c){ return c !== ' '; });
  var stage = document.getElementById('stage');
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var W = innerWidth, H = innerHeight;
  var letters = [];

  function rand(min, max){ return min + Math.random() * (max - min); }

  var BOX = 12; // half-size used for edge bounce, roughly matches the fixed font-size

  var portalEl = document.getElementById('portal');

  var sfxEls = [
    document.getElementById('sfx-1'),
    document.getElementById('sfx-2'),
    document.getElementById('sfx-3'),
    document.getElementById('sfx-4'),
    document.getElementById('sfx-5')
  ];
  function playDropSfx(){
    var base = sfxEls[Math.floor(Math.random() * sfxEls.length)];
    // clone so overlapping drops don't cut each other off
    var clip = base.cloneNode(true);
    clip.volume = 0.8;
    clip.play().catch(function(){});
  }

  function insideBox(x, y, pad){
    var r = portalEl.getBoundingClientRect();
    return x > r.left - pad && x < r.right + pad && y > r.top - pad && y < r.bottom + pad;
  }

  function buildLetters(){
    stage.innerHTML = '';
    letters = [];
    W = innerWidth; H = innerHeight;

    var margin = 0.08; // keep letters away from the very edge

    chars.forEach(function(ch){
      var el = document.createElement('div');
      el.className = 'letter';
      el.textContent = ch;
      stage.appendChild(el);

      var startX, startY, tries = 0;
      do{
        startX = rand(W*margin, W*(1-margin));
        startY = rand(H*margin, H*(1-margin));
        tries++;
      } while(insideBox(startX, startY, 12) && tries < 20);

      var L = {
        el: el,
        x: startX,
        y: startY,
        vx: rand(-0.4, 0.4),
        vy: rand(-0.4, 0.4),
        depth: rand(0.7, 1.3), // affects how strongly wind pushes it
        dragging: false,
        inBox: false,
        dragOffX: 0,
        dragOffY: 0,
        lastDragX: 0,
        lastDragY: 0
      };
      letters.push(L);

      attachDrag(el, L);
    });
  }

  function attachDrag(el, L){
    function down(clientX, clientY){
      L.dragging = true;
      L.inBox = false;
      el.classList.add('dragging');
      L.dragOffX = clientX - L.x;
      L.dragOffY = clientY - L.y;
      L.lastDragX = clientX;
      L.lastDragY = clientY;
    }
    function move(clientX, clientY){
      if(!L.dragging) return;
      var nx = clientX - L.dragOffX;
      var ny = clientY - L.dragOffY;
      L.vx = nx - L.x;
      L.vy = ny - L.y;
      L.x = nx;
      L.y = ny;
    }
    function up(){
      if(!L.dragging) return;
      L.dragging = false;
      el.classList.remove('dragging');
      // only letters manually dropped inside the box come to rest there
      var cx = L.x + 7, cy = L.y + 7;
      if(insideBox(cx, cy, 0)){
        L.inBox = true;
        L.vx = 0;
        L.vy = 0;
        if(needed.indexOf(L.el.textContent) !== -1){
          playDropSfx();
        }
      } else {
        L.inBox = false;
      }
    }

    el.addEventListener('mousedown', function(e){ down(e.clientX, e.clientY); e.preventDefault(); });
    window.addEventListener('mousemove', function(e){ move(e.clientX, e.clientY); });
    window.addEventListener('mouseup', up);

    el.addEventListener('touchstart', function(e){
      var t = e.touches[0];
      down(t.clientX, t.clientY);
    }, {passive:true});
    window.addEventListener('touchmove', function(e){
      if(L.dragging && e.touches[0]) move(e.touches[0].clientX, e.touches[0].clientY);
    }, {passive:true});
    window.addEventListener('touchend', up);
  }

  var solvedSublime = false;

  var needed = ['S','U','B','L','I','M','E']; // used elsewhere (sfx trigger) — kept as a flat list

  // required letter counts for each word the box can recognise
  var sublimeCounts = { S:1, U:1, B:1, L:1, I:1, M:1, E:1 };
  var pleaseCounts  = { P:1, L:1, E:2, A:1, S:1 };

  function bounceOffBox(L){
    var r = portalEl.getBoundingClientRect();
    var radius = 8; // approx letter half-size
    var cx = L.x + 7, cy = L.y + 7;

    var closestX = Math.min(Math.max(cx, r.left), r.right);
    var closestY = Math.min(Math.max(cy, r.top), r.bottom);
    var dx = cx - closestX, dy = cy - closestY;
    var distSq = dx*dx + dy*dy;

    if(distSq >= radius*radius) return;

    var dist = Math.sqrt(distSq);
    if(dist > 0.0001){
      var nx = dx/dist, ny = dy/dist;
      L.x = closestX + nx*radius - 7;
      L.y = closestY + ny*radius - 7;
      var vDotN = L.vx*nx + L.vy*ny;
      if(vDotN < 0){
        L.vx = (L.vx - 2*vDotN*nx) * 0.7;
        L.vy = (L.vy - 2*vDotN*ny) * 0.7;
      }
    } else {
      // center landed exactly inside the box (rare) — eject along shortest side
      var leftPen = cx - r.left, rightPen = r.right - cx;
      var topPen = cy - r.top, bottomPen = r.bottom - cy;
      var minPen = Math.min(leftPen, rightPen, topPen, bottomPen);
      if(minPen === leftPen){ L.x = r.left - radius - 7; L.vx = -Math.abs(L.vx) - 0.5; }
      else if(minPen === rightPen){ L.x = r.right + radius - 7; L.vx = Math.abs(L.vx) + 0.5; }
      else if(minPen === topPen){ L.y = r.top - radius - 7; L.vy = -Math.abs(L.vy) - 0.5; }
      else { L.y = r.bottom + radius - 7; L.vy = Math.abs(L.vy) + 0.5; }
    }
  }

    }
    return counts;

  /* ---------------- pointer velocity tracking (wind) ---------------- */
  var mouseX = W/2, mouseY = H/2;
  var lastMouseX = mouseX, lastMouseY = mouseY;
  var mvx = 0, mvy = 0;
  var hasPointer = false;

  function updatePointer(x, y){
    mouseX = x; mouseY = y;
    hasPointer = true;
  }
  window.addEventListener('mousemove', function(e){ updatePointer(e.clientX, e.clientY); });
  window.addEventListener('touchmove', function(e){
    if(e.touches && e.touches[0]) updatePointer(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive:true});

  var INFLUENCE = 100;    // px radius of wind effect
  var SPEED_THRESHOLD = 6;   // cursor must move THIS fast to create wind — slow approach = no push, so you can grab
  var STRENGTH = 0.5;    // how hard the wind pushes
  var FRICTION = 0.99;   // very light damping so letters keep gliding

  function frame(){
    // smooth pointer velocity
    mvx = mvx * 0.8 + (mouseX - lastMouseX) * 0.2;
    mvy = mvy * 0.8 + (mouseY - lastMouseY) * 0.2;
    lastMouseX = mouseX; lastMouseY = mouseY;

    var speed = Math.sqrt(mvx*mvx + mvy*mvy);

    for(var i=0; i<letters.length; i++){
      var L = letters[i];
      if(L.dragging){
        L.el.style.transform = 'translate(' + L.x + 'px,' + L.y + 'px)';
        continue;
      }
      if(L.inBox){
        // at rest inside the box — no wind, no drift, just sits there until dragged again
        continue;
      }

      if(hasPointer && speed > SPEED_THRESHOLD){
        var dx = L.x - mouseX;
        var dy = L.y - mouseY;
        var dist = Math.sqrt(dx*dx + dy*dy) + 0.001;
        if(dist < INFLUENCE){
          var falloff = 1 - dist / INFLUENCE;
          var force = speed * STRENGTH * falloff * L.depth;
          L.vx += (dx/dist) * force;
          L.vy += (dy/dist) * force;
        }
      }

      L.vx *= FRICTION;
      L.vy *= FRICTION;

      L.x += L.vx;
      L.y += L.vy;

      bounceOffBox(L);

      // bounce off the edges of the screen
      if(L.x < BOX){ L.x = BOX; L.vx = Math.abs(L.vx); }
      if(L.x > W - BOX){ L.x = W - BOX; L.vx = -Math.abs(L.vx); }
      if(L.y < BOX){ L.y = BOX; L.vy = Math.abs(L.vy); }
      if(L.y > H - BOX){ L.y = H - BOX; L.vy = -Math.abs(L.vy); }

      L.el.style.transform = 'translate(' + L.x + 'px,' + L.y + 'px)';
    }

    updatePortalState();
    requestAnimationFrame(frame);
  }

  function frameStatic(){
    // reduced motion: place letters at rest, no animation loop, drag still works
    for(var i=0; i<letters.length; i++){
      var L = letters[i];
      L.el.style.transform = 'translate(' + L.x + 'px,' + L.y + 'px)';
    }
    updatePortalState();
    requestAnimationFrame(frameStatic);
  }

  if(reduceMotion){
    frameStatic();
  } else {
    requestAnimationFrame(frame);
  }
