<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nox Oleander — Sublime in all Places</title>
<meta name="description" content="Nox Oleander — Sublime in all Places">
<style>
  :root{
    --letter-color:#ffe600;
  }
  *{ box-sizing:border-box; }
  html, body{
    margin:0;
    height:100%;
    overflow:hidden;
    background:#000;
  }

  #bg{
    position:fixed;
    inset:0;
    background:#000;
    z-index:0;
    overflow:hidden;
  }
  #bg video{
    position:absolute;
    top:50%; left:50%;
    min-width:100%; min-height:100%;
    width:auto; height:auto;
    transform:translate(-50%,-50%);
    object-fit:cover;
  }

  #stage{
    position:fixed;
    inset:0;
    z-index:1;
    overflow:hidden;
  }

  #portal{
    position:fixed;
    width:150px;
    height:90px;
    left:50%;
    top:50%;
    transform:translate(-50%, -50%);
    background:transparent;
    border:1px solid rgba(255,255,255,.8);
    z-index:1;
  }

  #secret-view, #view-yes, #view-no, #page-perf, #page-please,
  #page-artlife, #page-artifact-2, #page-artifact-3{
    position:fixed;
    inset:0;
    z-index:3;
    background:#000;
    overflow:hidden;
    opacity:0;
    pointer-events:none;
    transition:opacity 1.1s;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }
  #secret-view video,
  #view-yes video,
  #view-no video,
  #page-perf video,
  #page-please video,
  #page-artifact-2 video,
  #page-artifact-3 video{
    position:absolute;
    top:50%; left:50%;
    min-width:100%; min-height:100%;
    width:auto; height:auto;
    transform:translate(-50%,-50%);
    object-fit:cover;
    z-index:0;
  }
  body.opened #stage,
  body.opened #portal{
    opacity:0;
    pointer-events:none;
    transition:opacity .8s;
  }
  body.v-secret #secret-view{ opacity:1; pointer-events:auto; }
  body.v-yes #view-yes{ opacity:1; pointer-events:auto; }
  body.v-no #view-no{ opacity:1; pointer-events:auto; }
  body.v-perf #page-perf{ opacity:1; pointer-events:auto; }
  body.v-please #page-please{ opacity:1; pointer-events:auto; }
  body.v-artifact-1 #page-artlife{ opacity:1; pointer-events:auto; }
  body.v-artifact-2 #page-artifact-2{ opacity:1; pointer-events:auto; }
  body.v-artifact-3 #page-artifact-3{ opacity:1; pointer-events:auto; }
  body.v-note #page-note{ opacity:1; pointer-events:auto; }

  #page-note{
    position:fixed;
    inset:0;
    z-index:3;
    opacity:0;
    pointer-events:none;
    transition:opacity 1.1s;
    background:#000 url('img-note.JPG') center center / cover no-repeat;
  }
  .note-zone{
    position:absolute;
    cursor:pointer;
  }
  #note-zone-4{ left:7%;  top:2%;  width:26%; height:39%; }
  #note-zone-1{ left:68%; top:20%; width:10%; height:23%; }
  #note-zone-2{ left:30%; top:55%; width:30%; height:45%; }
  #note-zone-3{ left:78%; top:78%; width:14%; height:22%; }

  #img-autism{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%, -50%);
    max-width:50vw;
    max-height:50vh;
    z-index:2;
    display:none;
  }

  #page-perf .perf-hold-video{
    z-index:2;
    opacity:0;
    transition:none;
  }
  #page-perf .perf-hold-video.active{
    opacity:1;
  }

  #perf-intro{
    position:absolute;
    inset:0;
    z-index:5;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    opacity:1;
  }
  #perf-intro-text{
    margin:0;
    padding:0 2rem;
    text-align:center;
    font-family:Arial, sans-serif;
    font-weight:700;
    font-size:0.95rem;
    color:var(--letter-color);
    opacity:0;
  }
  #perf-intro-text.show{
    opacity:1;
  }

  #yes-img{
    position:relative;
    z-index:1;
    max-width:60vw;
    max-height:60vh;
    cursor:pointer;
    user-select:none;
    opacity:1;
    transition:opacity .8s;
  }

  .back-phrase{
    position:absolute;
    left:50%;
    top:78%;
    transform:translate(-50%, -50%);
    z-index:1;
    background:transparent;
    border:none;
    padding:0;
    font-family:Arial, sans-serif;
    font-weight:700;
    font-size:0.95rem;
    color:var(--letter-color);
    cursor:pointer;
    opacity:.85;
    transition:opacity .2s;
    display:none;
    text-align:center;
  }
  .back-phrase:hover{ opacity:1; }
  #perf-please-msg{
    z-index:6;
  }

  .options{
    position:absolute;
    left:50%;
    top:78%;
    transform:translate(-50%, -50%);
    z-index:1;
    display:flex;
    gap:3.5rem;
    opacity:0;
    pointer-events:none;
  }
  .options.show{
    opacity:1;
    pointer-events:auto;
  }
  .opt{
    background:transparent;
    border:none;
    padding:0;
    font-family:Arial, sans-serif;
    font-weight:700;
    font-size:0.95rem;
    color:var(--letter-color);
    cursor:pointer;
    opacity:.85;
    transition:opacity .2s;
  }
  .opt:hover{ opacity:1; }

  #secret-view .back,
  #view-yes .back,
  #view-no .back,
  #page-perf .back,
  #page-please .back,
  #page-artifact-2 .back,
  #page-artifact-3 .back,
  #page-note .back{
    position:absolute;
    bottom:0; left:0;
    z-index:1;
  }

  #page-artlife .artlife-video{
    position:static;
    max-width:75vw;
    max-height:75vh;
    width:auto;
    height:auto;
    object-fit:contain;
  }

  #please-artifacts{
    position:absolute;
    inset:0;
    z-index:3;
    display:none;
    pointer-events:none;
  }
  #please-artifacts.show{
    display:block;
  }
  .artifact-item{
    position:absolute;
    height:80px;
    width:auto;
    cursor:pointer;
    pointer-events:auto;
  }
  #page-please .artifact-item video{
    position:static;
    display:block;
    min-width:0;
    min-height:0;
    width:auto;
    height:80px;
    transform:none;
    object-fit:initial;
  }
  #artifact-4{ top:22%;  left:50%; transform:translate(-50%, 0); }
  #artifact-3{ bottom:22%; left:50%; transform:translate(-50%, 0); }
  #artifact-1{ left:18%;  top:50%; transform:translate(0, -50%); }
  #artifact-2{ right:18%; top:50%; transform:translate(0, -50%); }

  #please-messages{
    position:absolute;
    inset:0;
    z-index:2;
    pointer-events:none;
  }
  .please-msg{
    position:absolute;
    transform:translate(-50%, -50%);
    margin:0;
    font-family:Arial, sans-serif;
    font-weight:700;
    font-size:0.95rem;
    color:var(--letter-color);
    text-align:center;
    max-width:55vw;
  }

  a.back{
    margin:1.4rem;
    font-family:Arial, sans-serif;
    font-size:.7rem;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--letter-color);
    text-decoration:none;
    opacity:.6;
    transition:opacity .2s;
  }
  a.back:hover{ opacity:1; }

  #sound-toggle{
    position:fixed;
    bottom:1.2rem;
    right:1.2rem;
    z-index:10;
    background:transparent;
    border:1px solid rgba(255,255,255,.4);
    color:#fff;
    font-family:Arial, sans-serif;
    font-size:.65rem;
    letter-spacing:.08em;
    text-transform:uppercase;
    padding:.4rem .7rem;
    cursor:pointer;
    opacity:.5;
    transition:opacity .2s;
  }
  #sound-toggle:hover{ opacity:1; }

  .letter{
    position:absolute;
    top:0; left:0;
    font-family:Arial, sans-serif;
    font-weight:700;
    font-size:0.95rem;
    color:var(--letter-color);
    user-select:none;
    pointer-events:auto;
    cursor:grab;
    will-change:transform;
    line-height:1;
  }
  .letter.dragging{
    cursor:grabbing;
    z-index:5;
  }

  .letter.font-orn{
    font-family:'Bodoni Ornaments', serif;
    font-weight:400;
  }

  #stage-killed{
    position:absolute;
    inset:0;
    z-index:1;
    overflow:hidden;
  }

  #killed-sentence{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:0.4em;
    text-align:center;
    pointer-events:none;
    padding:0 8vw;
  }
  .killed-line{
    margin:0;
    font-family:Arial, sans-serif;
    font-weight:700;
    font-size:0.95rem;
    color:var(--letter-color);
  }
  .killed-group{
    opacity:0;
  }

  @media (prefers-reduced-motion: reduce){
    .letter{ transition:none; }
  }
</style>
</head>
