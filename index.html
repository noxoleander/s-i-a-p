<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nox Oleander — Sublime in all Places</title>

<style>
  :root{
    --letter-color:#ffe600;
  }
  *{ box-sizing:border-box; }
  html, body{
    margin:0;
    height:100%;
    overflow:hidden;
    background:#000;
  }

  #bg{
    position:fixed;
    inset:0;
    background:#000;
    z-index:0;
    overflow:hidden;
  }
  #bg video{
    position:absolute;
    top:50%; left:50%;
    min-width:100%; min-height:100%;
    width:auto; height:auto;
    transform:translate(-50%,-50%);
    object-fit:cover;
  }

  #stage{
    position:fixed;
    inset:0;
    z-index:1;
    overflow:hidden;
  }

  #portal{
    position:fixed;
    width:150px;
    height:90px;
    left:50%;
    top:50%;
    transform:translate(-50%, -50%);
    background:transparent;
    border:1px solid rgba(255,255,255,.8);
    z-index:1;
  }

  #secret-view, #view-yes, #view-no, #page-perf, #page-please,
  #page-artlife, #page-artifact-2, #page-artifact-3{
    position:fixed;
    inset:0;
    z-index:3;
    background:#000;
    overflow:hidden;
    opacity:0;
    pointer-events:none;
    transition:opacity 1.1s;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }

  /* PAGE ARTIFACT 2 - STYLE */
  #page-artifact-2 {
    background: #000 url('img-artfact-2.JPG') center center / cover no-repeat;
    cursor: pointer;
  }
  #light-display-img {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    max-width: 75vw;
    max-height: 75vh;
    z-index: 5;
    display: none;
    pointer-events: none;
  }
  #light-lose-text {
    position: absolute;
    top: 5%;
    width: 100%;
    text-align: center;
    font-family: Arial, sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--letter-color);
    display: none;
    z-index: 6;
    pointer-events: none;
  }

  #secret-view video,
  #view-yes video,
  #view-no video,
  #page-perf video,
  #page-please video,
  #page-artifact-3 video{
    position:absolute;
    top:50%; left:50%;
    min-width:100%; min-height:100%;
    width:auto; height:auto;
    transform:translate(-50%,-50%);
    object-fit:cover;
    z-index:0;
  }
  body.opened #stage,
  body.opened #portal{
    opacity:0;
    pointer-events:none;
    transition:opacity .8s;
  }
  body.v-secret #secret-view{ opacity:1; pointer-events:auto; }
  body.v-yes #view-yes{ opacity:1; pointer-events:auto; }
  body.v-no #view-no{ opacity:1; pointer-events:auto; }
  body.v-perf #page-perf{ opacity:1; pointer-events:auto; }
  body.v-please #page-please{ opacity:1; pointer-events:auto; }
  body.v-artifact-1 #page-artlife{ opacity:1; pointer-events:auto; }
  body.v-artifact-2 #page-artifact-2{ opacity:1; pointer-events:auto; }
  body.v-artifact-3 #page-artifact-3{ opacity:1; pointer-events:auto; }
  body.v-note #page-note{ opacity:1; pointer-events:auto; }

  #page-note{
    position:fixed;
    inset:0;
    z-index:3;
    opacity:0;
    pointer-events:none;
    transition:opacity 1.1s;
    background:#000 url('img-note.JPG') center center / cover no-repeat;
  }
  .note-zone{ position:absolute; cursor:pointer; }
  #note-zone-4{ left:7%;  top:2%;  width:26%; height:39%; }
  #note-zone-1{ left:68%; top:20%; width:10%; height:23%; }
  #note-zone-2{ left:30%; top:55%; width:30%; height:45%; }
  #note-zone-3{ left:78%; top:78%; width:14%; height:22%; }

  #img-autism{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%, -50%);
    max-width:50vw;
    max-height:50vh;
    z-index:2;
    display:none;
  }

  #page-perf .perf-hold-video{ z-index:2; opacity:0; transition:none; }
  #page-perf .perf-hold-video.active{ opacity:1; }

  #perf-intro{
    position:absolute;
    inset:0;
    z-index:5;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    opacity:1;
  }
  #perf-intro-text{
    margin:0;
    padding:0 2rem;
    text-align:center;

    font-weight:700;

    color:var(--letter-color);

    background:transparent;

    font-size:0.95rem;

    cursor:pointer;

  }

  #view-yes .back,
  #view-no .back,
  #page-perf .back,
  #page-please .back,
  #page-artifact-2 .back,
  #page-artifact-3 .back,
  #page-note .back{
    position:absolute;
    bottom:0; left:0;
    z-index:1;
  }

  #page-artlife .artlife-video{
    position:static;
    max-width:75vw;

    width:auto;

  }

  #please-artifacts{
    position:absolute;

    z-index:3;

    pointer-events:none;
  }

    position:absolute;
    height:80px;
    width:auto;

  }
  #page-please .artifact-item video{

    display:block;
    min-width:0;

  }

  #artifact-1{ left:18%;  top:50%; transform:translate(0, -50%); }
  #artifact-2{ right:18%; top:50%; transform:translate(0, -50%); }

  #please-messages{

    inset:0;
    z-index:2;

  }
  .please-msg{
    position:absolute;
    transform:translate(-50%, -50%);

    font-family:Arial, sans-serif;
    font-weight:700;
    font-size:0.95rem;

  }

  a.back{
    margin:1.4rem;
    font-family:Arial, sans-serif;

    text-transform:uppercase;
    color:var(--letter-color);
    text-decoration:none;

    transition:opacity .2s;
  }
  a.back:hover{ opacity:1; }

  #sound-toggle{

    bottom:1.2rem;
    right:1.2rem;
    z-index:10;
    background:transparent;
    border:1px solid rgba(255,255,255,.4);
    color:#fff;
    font-family:Arial, sans-serif;
    font-size:.65rem;
    letter-spacing:.08em;
    text-transform:uppercase;
    padding:.4rem .7rem;
    cursor:pointer;
    opacity:.5;
    transition:opacity .2s;
  }
  #sound-toggle:hover{ opacity:1; }

  .letter{
    position:absolute;
    top:0; left:0;
    font-family:Arial, sans-serif;
    font-weight:700;
    font-size:0.95rem;

  #stage-killed{ position:absolute; inset:0; z-index:1; overflow:hidden; }

  #killed-sentence{

  .killed-line{

    color:var(--letter-color);
  }
  .killed-group{ opacity:0; }

  @media (prefers-reduced-motion: reduce){ .letter{ transition:none; } }
</style>

<script>
(function(){
  // --- PRECHARGEMENT ARTIFACT 2 ---
  var lightSet1 = ['light-1.JPG','light-2.JPG','light-3.JPG','light-4.JPG','light-5.JPG','light-6.JPG'];
  var lightSet2 = ['light-a.JPG','light-b.JPG','light-c.JPG','light-d.JPG','light-f.JPG'];
  [lightSet1, lightSet2].forEach(function(set){
    set.forEach(function(src){ var img = new Image(); img.src = src; });
  });

  // --- MOTEUR DE PHYSIQUE ---
  var word = "SUBLIME IN ALL PLACES SUBLIME IN ALL PLACES SUBLIME IN ALL PLACES";
  var chars = word.split('').filter(function(c){ return c !== ' '; });
  var stage = document.getElementById('stage');
  var portalEl = document.getElementById('portal');
  var W = innerWidth, H = innerHeight;
  var letters = [];
  function rand(min, max){ return min + Math.random() * (max - min); }

  function buildLetters(){
    stage.innerHTML = ''; letters = [];
    chars.forEach(function(ch){
      var el = document.createElement('div');
      el.className = 'letter'; el.textContent = ch;
      stage.appendChild(el);
      var L = {
        el: el, x: rand(W*0.1, W*0.9), y: rand(H*0.1, H*0.9),
        vx: rand(-0.5, 0.5), vy: rand(-0.5, 0.5), depth: rand(0.7, 1.3),
        dragging: false, inBox: false
      };
      letters.push(L); attachDrag(el, L);
    });
  }

  function attachDrag(el, L){
    function move(x, y){ if(L.dragging){ L.vx = x - L.x; L.vy = y - L.y; L.x = x; L.y = y; } }
    el.addEventListener('mousedown', function(e){ L.dragging = true; L.inBox = false; e.preventDefault(); });
    window.addEventListener('mousemove', function(e){ move(e.clientX, e.clientY); });
    window.addEventListener('mouseup', function(){ 
      if(L.dragging){ 
        L.dragging = false; 
        var r = portalEl.getBoundingClientRect();
        if(L.x > r.left && L.x < r.right && L.y > r.top && L.y < r.bottom){ L.inBox = true; L.vx = 0; L.vy = 0; playDropSfx(); }
      }
    });
    el.addEventListener('touchstart', function(e){ L.dragging = true; }, {passive:true});
    window.addEventListener('touchmove', function(e){ if(e.touches[0]) move(e.touches[0].clientX, e.touches[0].clientY); }, {passive:true});
    window.addEventListener('touchend', function(){ L.dragging = false; });
  }

  function playDropSfx(){
    var id = 'sfx-' + Math.ceil(Math.random() * 5);
    var snd = document.getElementById(id).cloneNode(true); snd.volume = 0.5; snd.play();
  }

  function frame(){
    letters.forEach(function(L){
      if(!L.dragging && !L.inBox){
        L.vx *= 0.99; L.vy *= 0.99; L.x += L.vx; L.y += L.vy;
        if(L.x < 0 || L.x > W) L.vx *= -1;
        if(L.y < 0 || L.y > H) L.vy *= -1;
      }
      L.el.style.transform = 'translate(' + L.x + 'px,' + L.y + 'px)';
    });
    updatePortalState();
    requestAnimationFrame(frame);
  }

  // --- LOGIQUE PORTAIL ---
  var solvedSublime = false, solvedPlease = false;
  function updatePortalState(){
    if(solvedSublime && solvedPlease) return;
    var counts = {};
    letters.forEach(function(L){ if(L.inBox) counts[L.el.textContent] = (counts[L.el.textContent] || 0) + 1; });
    if(!solvedSublime && ['S','U','B','L','I','M','E'].every(function(c){ return counts[c] >= 1; })){
      solvedSublime = true; showSecret();
    }
    if(!solvedPlease && counts['P']>=1 && counts['L']>=1 && counts['E']>=2 && counts['A']>=1 && counts['S']>=1){
      solvedPlease = true; showPlease();
    }
  }

  // --- NAVIGATION ---
  var currentView = 'home';
  var allViews = ['secret','yes','no','perf','please','artifact-1','artifact-2','artifact-3','note'];

  function hideAll(){
    document.body.classList.remove('opened');
    allViews.forEach(function(v){ document.body.classList.remove('v-'+v); });
    document.getElementById('artlife-video').pause();
    document.getElementById('son-lose').pause();
  }

  function showSecret(){ hideAll(); document.body.classList.add('opened','v-secret'); switchTrack(bgmSecret); currentView='secret'; }
  function showYes(){ hideAll(); document.body.classList.add('opened','v-yes'); switchTrack(bgmYes); enterYesSequence(); currentView='yes'; }
  function showNo(){ hideAll(); document.body.classList.add('opened','v-no'); currentView='no'; }
  function showPerf(){ hideAll(); document.body.classList.add('opened','v-perf'); enterPerfPage(); currentView='perf'; }
  function showPlease(){ hideAll(); document.body.classList.add('opened','v-please'); switchTrack(bgmHome); enterPleasePage(); currentView='please'; }
  function showArtifact(n){ 
    hideAll(); document.body.classList.add('opened','v-artifact-'+n); 
    if(n==='1'){ document.getElementById('artlife-video').play(); }
    if(n==='2'){ enterArtifact2(); }
    currentView='artifact-'+n;
  }
  function showNote(){ hideAll(); document.body.classList.add('opened','v-note'); currentView='note'; }

  // --- ARTIFACT 2 LOGIQUE ---
  var lightCounter = 0, lightVisible = false;
  function enterArtifact2(){ lightVisible = false; document.getElementById('light-display-img').style.display='none'; }
  document.getElementById('page-artifact-2').addEventListener('click', function(e){
    if(e.target.classList.contains('back')) return;
    var img = document.getElementById('light-display-img');
    if(!lightVisible){
      lightVisible = true; lightCounter++;
      var set = (lightCounter > 26) ? lightSet2 : lightSet1;
      img.src = set[Math.floor(Math.random()*set.length)];
      img.style.display = 'block';
      if(soundOn) document.getElementById('switch-sfx-1').cloneNode(true).play();
      if(lightCounter > 26){ 
        document.getElementById('light-lose-text').style.display='block';
        if(soundOn) document.getElementById('son-lose').play();
      }
    } else {
      lightVisible = false; lightCounter++;
      img.style.display = 'none';
      if(soundOn) document.getElementById('switch-sfx-2').cloneNode(true).play();
    }
  });

  // --- PLEASE PAGE LOGIQUE ---
  var pleasePhrases = ["Something's off.", "I hope to see a horse.", "How long have I been here?"], pleaseIdx = 0;
  function enterPleasePage(){ 
    pleaseIdx = 0; document.getElementById('please-messages').innerHTML = ''; 
    document.getElementById('please-artifacts').classList.remove('show');
  }
  document.getElementById('page-please').addEventListener('click', function(e){
    if(e.target.classList.contains('back') || e.target.closest('.artifact-item')) return;
    if(pleaseIdx < pleasePhrases.length){
      var p = document.createElement('p'); p.className = 'please-msg'; p.textContent = pleasePhrases[pleaseIdx++];
      p.style.left = rand(20,80)+'%'; p.style.top = rand(20,80)+'%';
      document.getElementById('please-messages').appendChild(p);
    } else {
      document.getElementById('please-artifacts').classList.add('show');
      document.querySelectorAll('.artifact-item video').forEach(function(v){ v.play(); });
      document.getElementById('artifacts-reveal-sound').play();
    }
  });

  // --- EVENTS RETOUR ---
  document.querySelectorAll('.back').forEach(function(btn){
    btn.addEventListener('click', function(e){ e.preventDefault(); hideAll(); currentView='home'; switchTrack(bgmHome); });
  });

  // --- INITIALISATION ---
  buildLetters(); frame();

  // --- SONS ---
  var soundOn = false, unlocked = false;
  var bgmHome = document.getElementById('bgm-home'), bgmSecret = document.getElementById('bgm-secret'),
      bgmYes = document.getElementById('bgm-yes'), bgmPerf = document.getElementById('bgm-perf');
  var currentTrack = bgmHome;

  function switchTrack(t){ if(unlocked && soundOn){ currentTrack.pause(); currentTrack=t; t.play(); } else { currentTrack=t; } }
  document.getElementById('sound-toggle').addEventListener('click', function(){
    unlocked = true;
    if(!soundOn){ soundOn=true; this.textContent='son : on'; currentTrack.play(); }
    else { soundOn=false; this.textContent='son : off'; currentTrack.pause(); }
  });

  // --- RACCOURCIS DEBUG ---
  window.addEventListener('keydown', function(e){
    if(e.key === '1') { hideAll(); currentView='home'; }
    if(e.key === '8') showArtifact('2');
    if(e.key === '6') showPlease();
  });

  // --- PLACEHOLDERS ---
  function enterYesSequence(){} function enterPerfPage(){} function enterKilledPage(){}
  document.getElementById('opt-yes').onclick = showYes;
  document.getElementById('opt-no').onclick = showNo;
  document.getElementById('artifact-2').onclick = function(){ showArtifact('2'); };
  document.getElementById('artifact-1').onclick = function(){ showArtifact('1'); };
  document.getElementById('artifact-3').onclick = function(){ showArtifact('3'); };
  document.getElementById('artifact-4').onclick = function(){ showNote(); };

})();
</script>
</body>
</html>
