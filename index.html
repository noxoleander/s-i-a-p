<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nox Oleander — Sublime in all Places</title>
<style>
  :root{ --letter-color:#ffe600; }
  *{ box-sizing:border-box; }
  html, body{ margin:0; height:100%; overflow:hidden; background:#000; }
  #bg{ position:fixed; inset:0; background:#000; z-index:0; overflow:hidden; }
  #bg video{ position:absolute; top:50%; left:50%; min-width:100%; min-height:100%; width:auto; height:auto; transform:translate(-50%,-50%); object-fit:cover; }
  #stage{ position:fixed; inset:0; z-index:1; overflow:hidden; }
  #portal{ position:fixed; width:150px; height:90px; left:50%; top:50%; transform:translate(-50%, -50%); background:transparent; border:1px solid rgba(255,255,255,.8); z-index:1; }
  #secret-view, #view-yes, #view-no, #page-perf, #page-please, #page-artlife, #page-artifact-2, #page-artifact-3{
    position:fixed; inset:0; z-index:3; background:#000; overflow:hidden; opacity:0; pointer-events:none; transition:opacity 1.1s; display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  #secret-view video, #view-yes video, #view-no video, #page-perf video, #page-please video, #page-artifact-2 video, #page-artifact-3 video{
    position:absolute; top:50%; left:50%; min-width:100%; min-height:100%; width:auto; height:auto; transform:translate(-50%,-50%); object-fit:cover; z-index:0;
  }
  body.opened #stage, body.opened #portal{ opacity:0; pointer-events:none; transition:opacity .8s; }
  body.v-secret #secret-view{ opacity:1; pointer-events:auto; }
  body.v-yes #view-yes{ opacity:1; pointer-events:auto; }
  body.v-no #view-no{ opacity:1; pointer-events:auto; }
  body.v-perf #page-perf{ opacity:1; pointer-events:auto; }
  body.v-please #page-please{ opacity:1; pointer-events:auto; }
  body.v-artifact-1 #page-artlife{ opacity:1; pointer-events:auto; }
  body.v-artifact-2 #page-artifact-2{ opacity:1; pointer-events:auto; }
  body.v-artifact-3 #page-artifact-3{ opacity:1; pointer-events:auto; }
  body.v-note #page-note{ opacity:1; pointer-events:auto; }
  #page-note{ position:fixed; inset:0; z-index:3; opacity:0; pointer-events:none; transition:opacity 1.1s; background:#000 url('img-note.JPG') center center / cover no-repeat; }
  .note-zone{ position:absolute; cursor:pointer; }
  #note-zone-4{ left:7%; top:2%; width:26%; height:39%; }
  #note-zone-1{ left:68%; top:20%; width:10%; height:23%; }
  #note-zone-2{ left:30%; top:55%; width:30%; height:45%; }
  #note-zone-3{ left:78%; top:78%; width:14%; height:22%; }
  #img-autism{ position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); max-width:50vw; max-height:50vh; z-index:2; display:none; }
  #page-perf .perf-hold-video{ z-index:2; opacity:0; transition:none; }
  #page-perf .perf-hold-video.active{ opacity:1; }
  #perf-intro{ position:absolute; inset:0; z-index:5; background:#000; display:flex; align-items:center; justify-content:center; cursor:pointer; opacity:1; }
  #perf-intro-text{ margin:0; padding:0 2rem; text-align:center; font-family:Arial, sans-serif; font-weight:700; font-size:0.95rem; color:var(--letter-color); opacity:0; }
  #perf-intro-text.show{ opacity:1; }
  #yes-img{ position:relative; z-index:1; max-width:60vw; max-height:60vh; cursor:pointer; user-select:none; opacity:1; transition:opacity .8s; }
  .back-phrase{ position:absolute; left:50%; top:78%; transform:translate(-50%, -50%); z-index:1; background:transparent; border:none; padding:0; font-family:Arial, sans-serif; font-weight:700; font-size:0.95rem; color:var(--letter-color); cursor:pointer; opacity:.85; transition:opacity .2s; display:none; text-align:center; }
  .options{ position:absolute; left:50%; top:78%; transform:translate(-50%, -50%); z-index:1; display:flex; gap:3.5rem; opacity:0; pointer-events:none; }
  .options.show{ opacity:1; pointer-events:auto; }
  .opt{ background:transparent; border:none; padding:0; font-family:Arial, sans-serif; font-weight:700; font-size:0.95rem; color:var(--letter-color); cursor:pointer; opacity:.85; transition:opacity .2s; }
  #secret-view .back, #view-yes .back, #view-no .back, #page-perf .back, #page-please .back, #page-artifact-2 .back, #page-artifact-3 .back, #page-note .back{ position:absolute; bottom:0; left:0; z-index:1; }
  #page-artlife .artlife-video{ position:static; max-width:75vw; max-height:75vh; width:auto; height:auto; object-fit:contain; }
  #please-artifacts{ position:absolute; inset:0; z-index:3; display:none; pointer-events:none; }
  #please-artifacts.show{ display:block; }
  .artifact-item{ position:absolute; height:80px; width:auto; cursor:pointer; pointer-events:auto; }
  #page-please .artifact-item video{ position:static; display:block; min-width:0; min-height:0; width:auto; height:80px; transform:none; object-fit:initial; }
  #artifact-4{ top:22%; left:50%; transform:translate(-50%, 0); }
  #artifact-3{ bottom:22%; left:50%; transform:translate(-50%, 0); }
  #artifact-1{ left:18%; top:50%; transform:translate(0, -50%); }
  #artifact-2{ right:18%; top:50%; transform:translate(0, -50%); }
  #please-messages{ position:absolute; inset:0; z-index:2; pointer-events:none; }
  .please-msg{ position:absolute; transform:translate(-50%, -50%); margin:0; font-family:Arial, sans-serif; font-weight:700; font-size:0.95rem; color:var(--letter-color); text-align:center; max-width:55vw; }
  a.back{ margin:1.4rem; font-family:Arial, sans-serif; font-size:.7rem; letter-spacing:.1em; text-transform:uppercase; color:var(--letter-color); text-decoration:none; opacity:.6; transition:opacity .2s; }
  #sound-toggle{ position:fixed; bottom:1.2rem; right:1.2rem; z-index:10; background:transparent; border:1px solid rgba(255,255,255,.4); color:#fff; font-family:Arial, sans-serif; font-size:.65rem; letter-spacing:.08em; text-transform:uppercase; padding:.4rem .7rem; cursor:pointer; opacity:.5; transition:opacity .2s; }
  .letter{ position:absolute; top:0; left:0; font-family:Arial, sans-serif; font-weight:700; font-size:0.95rem; color:var(--letter-color); user-select:none; pointer-events:auto; cursor:grab; will-change:transform; line-height:1; }
  .letter.dragging{ cursor:grabbing; z-index:5; }
  #stage-killed{ position:absolute; inset:0; z-index:1; overflow:hidden; }
  #killed-sentence{ position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; gap:0.4em; text-align:center; pointer-events:none; padding:0 8vw; }
  .killed-line{ margin:0; font-family:Arial, sans-serif; font-weight:700; font-size:0.95rem; color:var(--letter-color); }
  .killed-group{ opacity:0; }
</style>

<script>
(function(){
  var word = "SUBLIME IN ALL PLACES SUBLIME IN ALL PLACES SUBLIME IN ALL PLACES";
  var chars = word.split('').filter(function(c){ return c !== ' '; });
  var stage = document.getElementById('stage');
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W = innerWidth, H = innerHeight;
  var letters = [];
  var BOX = 12;
  var portalEl = document.getElementById('portal');
  var needed = ['S','U','B','L','I','M','E'];

  function rand(min, max){ return min + Math.random() * (max - min); }

  var sfxEls = [
    document.getElementById('sfx-1'),
    document.getElementById('sfx-2'),
    document.getElementById('sfx-3'),
    document.getElementById('sfx-4'),
    document.getElementById('sfx-5')
  ];

  function playDropSfx(){
    var base = sfxEls[Math.floor(Math.random() * sfxEls.length)];
    if(!base) return;
    var clip = base.cloneNode(true);
    clip.volume = 0.8;
    clip.play().catch(function(){});
  }

  function insideBox(x, y, pad){
    var r = portalEl.getBoundingClientRect();
    return x > r.left - pad && x < r.right + pad && y > r.top - pad && y < r.bottom + pad;
  }

  function buildLetters(){
    stage.innerHTML = '';
    letters = [];
    W = innerWidth; H = innerHeight;
    var margin = 0.08;
    chars.forEach(function(ch){
      var el = document.createElement('div');
      el.className = 'letter';
      el.textContent = ch;
      stage.appendChild(el);
      var startX, startY, tries = 0;
      do {
        startX = rand(W*margin, W*(1-margin));
        startY = rand(H*margin, H*(1-margin));
        tries++;
      } while(insideBox(startX, startY, 12) && tries < 20);
      var L = { el: el, x: startX, y: startY, vx: rand(-0.4, 0.4), vy: rand(-0.4, 0.4), depth: rand(0.7, 1.3), dragging: false, inBox: false, dragOffX: 0, dragOffY: 0 };
      letters.push(L);
      attachDrag(el, L);
    });
  }

  function attachDrag(el, L){
    function down(clientX, clientY){ L.dragging = true; L.inBox = false; el.classList.add('dragging'); L.dragOffX = clientX - L.x; L.dragOffY = clientY - L.y; }
    function move(clientX, clientY){ if(!L.dragging) return; L.x = clientX - L.dragOffX; L.y = clientY - L.dragOffY; }
    function up(){ if(!L.dragging) return; L.dragging = false; el.classList.remove('dragging'); if(insideBox(L.x+7, L.y+7, 0)){ L.inBox = true; L.vx = 0; L.vy = 0; if(needed.indexOf(L.el.textContent) !== -1) playDropSfx(); } }
    el.addEventListener('mousedown', function(e){ down(e.clientX, e.clientY); e.preventDefault(); });
    window.addEventListener('mousemove', function(e){ move(e.clientX, e.clientY); });
    window.addEventListener('mouseup', up);
    el.addEventListener('touchstart', function(e){ var t = e.touches[0]; down(t.clientX, t.clientY); }, {passive:true});
    window.addEventListener('touchmove', function(e){ if(L.dragging && e.touches[0]) move(e.touches[0].clientX, e.touches[0].clientY); }, {passive:true});
    window.addEventListener('touchend', up);
  }

  buildLetters();

  var solvedSublime = false, solvedPlease = false;
  var sublimeCounts = { S:1, U:1, B:1, L:1, I:1, M:1, E:1 }, pleaseCounts = { P:1, L:1, E:2, A:1, S:1 };

  function bounceOffBox(L){
    var r = portalEl.getBoundingClientRect();
    var radius = 8;
    var cx = L.x + 7, cy = L.y + 7;
    var closestX = Math.min(Math.max(cx, r.left), r.right), closestY = Math.min(Math.max(cy, r.top), r.bottom);
    var dx = cx - closestX, dy = cy - closestY;
    if(dx*dx + dy*dy < radius*radius){
      L.vx *= -1.2; L.vy *= -1.2; L.x += L.vx * 2; L.y += L.vy * 2;
    }
  }

  function boxLetterCounts(){
    var counts = {};
    letters.forEach(function(L){ if(L.inBox){ var ch = L.el.textContent; counts[ch] = (counts[ch] || 0) + 1; } });
    return counts;
  }

  function updatePortalState(){
    if(solvedSublime && solvedPlease) return;
    var c = boxLetterCounts();
    if(!solvedSublime && Object.keys(sublimeCounts).every(k => (c[k]||0) >= sublimeCounts[k])){
      solvedSublime = true; letters.forEach(L => L.inBox = false);
      setTimeout(() => { navStack.push(currentView); showSecret(); }, 400);
    }
    if(!solvedPlease && Object.keys(pleaseCounts).every(k => (c[k]||0) >= pleaseCounts[k])){
      solvedPlease = true; letters.forEach(L => L.inBox = false);
      setTimeout(() => { navStack.push(currentView); showPlease(); }, 400);
    }
  }

  var currentView = 'home', navStack = [];
  var allViews = ['secret','yes','no','perf','please','artifact-1','artifact-2','artifact-3','note'];

  function clearAll(){
    document.body.className = '';
    allViews.forEach(v => { var el = document.getElementById(v==='artifact-1'?'page-artlife':'view-'+v)||document.getElementById('page-'+v); if(el){el.style.opacity=0; el.style.pointerEvents='none';} });
    document.getElementById('artlife-video').pause();
    stopKilledSounds();
  }

  function revealView(k){ document.body.classList.add('opened', 'v-'+k); var el = document.getElementById(k==='artifact-1'?'page-artlife':'view-'+k)||document.getElementById('page-'+k); if(el){el.style.opacity=1; el.style.pointerEvents='auto';} }

  function goHome(){ clearAll(); resetYesSequence(); switchTrack(bgmHome); currentView = 'home'; navStack = []; }
  function showSecret(){ clearAll(); revealView('secret'); switchTrack(bgmSecret); enterSecretPage(); currentView = 'secret'; }
  function showYes(){ clearAll(); revealView('yes'); switchTrack(bgmYes); enterYesSequence(); currentView = 'yes'; }
  function showNo(){ clearAll(); revealView('no'); switchTrack(bgmSecret); currentView = 'no'; }
  function showPerf(){ clearAll(); revealView('perf'); enterPerfPage(); currentView = 'perf'; }
  function showPlease(){ clearAll(); revealView('please'); switchTrack(bgmHome); enterPleasePage(); currentView = 'please'; }
  function showArtifact(n){ 
    clearAll(); revealView('artifact-'+n); 
    if(n==='1'){ silenceAmbient(); var v=document.getElementById('artlife-video'); v.muted=false; v.play(); } 
    else if(n==='3'){ enterKilledPage(); }
    else switchTrack(bgmHome);
    currentView = 'artifact-'+n; 
  }
  function showNote(){ clearAll(); revealView('note'); switchTrack(bgmHome); enterNotePage(); currentView = 'note'; }

  function goBack(){ var p = navStack.pop(); if(p==='secret') showSecret(); else if(p==='yes') showYes(); else if(p==='no') showNo(); else if(p==='perf') showPerf(); else if(p==='please') showPlease(); else if(p && p.startsWith('artifact')) showArtifact(p.split('-')[1]); else if(p==='note') showNote(); else goHome(); }

  document.querySelectorAll('.back').forEach(btn => btn.addEventListener('click', e => { e.preventDefault(); goBack(); }));
  document.getElementById('artlife-back-phrase').onclick = () => { navStack.pop(); showPlease(); revealPleaseArtifacts(); };

  // NOTE PAGE
  var noteClickHistory = [];
  function enterNotePage(){ noteClickHistory = []; document.getElementById('img-autism').style.display='none'; }
  document.querySelectorAll('.note-zone').forEach(z => z.onclick = () => {
    var id = z.getAttribute('data-note');
    var s = document.getElementById('sound-'+id); if(s) s.cloneNode(true).play();
    noteClickHistory.push(id); if(noteClickHistory.slice(-4).join(',') === 'note-1,note-2,note-3,note-4') document.getElementById('img-autism').style.display='block';
  });

  // PLEASE PAGE
  var pleaseMsgIndex = 0;
  function enterPleasePage(){ pleaseMsgIndex = 0; document.getElementById('please-messages').innerHTML = ''; document.getElementById('please-artifacts').classList.remove('show'); }
  function revealPleaseArtifacts(){ document.getElementById('please-artifacts').classList.add('show'); document.querySelectorAll('#please-artifacts video').forEach(v=>v.play()); document.getElementById('artifacts-reveal-sound').play(); }
  document.getElementById('page-please').onclick = e => {
    if(e.target.closest('.back') || e.target.closest('.artifact-item')) return;
    var ph = ["I think we're safe here","The temperature is perfect. It's like being indoors","No wind. No sound. Nothing. I can't even feel the grass beneath my feet.","Something's off.","I hope to see a horse.","I can't remember how I got here.","How long have I been here?"];
    if(pleaseMsgIndex < ph.length){
      var el = document.createElement('p'); el.className='please-msg'; el.textContent=ph[pleaseMsgIndex++];
      el.style.left = (20+Math.random()*60)+'%'; el.style.top = (20+Math.random()*60)+'%';
      document.getElementById('please-messages').appendChild(el);
    } else revealPleaseArtifacts();
  };
  [1,2,3,4].forEach(n => document.getElementById('artifact-'+n).onclick = e => { e.stopPropagation(); navStack.push(currentView); if(n===4) showNote(); else showArtifact(n); });

  // PERF PAGE
  var perfStarted = false;
  function enterPerfPage(){ perfStarted=false; document.getElementById('perf-intro').style.opacity=1; document.getElementById('perf-intro-text').classList.remove('show'); setTimeout(()=>document.getElementById('perf-intro-text').classList.add('show'), 2000); setTimeout(()=>perfStarted=true, 3000); }
  document.getElementById('perf-intro').onclick = () => { if(perfStarted){ document.getElementById('perf-intro').style.opacity=0; document.getElementById('perf-bg-video').play(); } };
  
  // YES SEQUENCE
  var yesIndex = 0;
  function resetYesSequence(){ yesIndex=0; document.getElementById('yes-img').src='yes-img-1.png'; document.getElementById('yes-undo').style.display='none'; }
  function enterYesSequence(){ resetYesSequence(); }
  document.getElementById('yes-img').onclick = () => {
    document.getElementById('yes-click-'+(yesIndex+1)).play();
    yesIndex++;
    if(yesIndex < 5){ document.getElementById('yes-img').src='yes-img-'+(yesIndex+1)+'.png'; document.getElementById('yes-undo').style.display='block'; }
    else { switchTrack(bgmPerf); navStack.push(currentView); showPerf(); }
  };
  document.getElementById('opt-yes').onclick = () => { navStack.push(currentView); showYes(); };
  document.getElementById('opt-no').onclick = () => { navStack.push(currentView); showNo(); };
  function enterSecretPage(){ document.getElementById('yesno-options').classList.remove('show'); setTimeout(()=>document.getElementById('yesno-options').classList.add('show'), 3000); }

  // KILLED (ARTIFACT 3)
  var killedRevealCount = 0;
  var killedLetters = [];
  function stopKilledSounds(){ for(var i=1;i<=8;i++){ var s=document.getElementById('kld-'+i); if(s){s.pause(); s.currentTime=0;} } }
  function enterKilledPage(){ killedRevealCount=0; stopKilledSounds(); document.querySelectorAll('.killed-group').forEach(g=>g.style.opacity=0); buildKilledLetters(); }
  function buildKilledLetters(){
    var st = document.getElementById('stage-killed'); st.innerHTML = ''; killedLetters = [];
    "oleander".split('').forEach(ch => {
      var el = document.createElement('div'); el.className='letter'; el.textContent=ch; st.appendChild(el);
      var L = { el:el, x:rand(W*0.1,W*0.9), y:rand(H*0.1,H*0.9), vx:rand(-0.5,0.5), vy:rand(-0.5,0.5), dragging:false };
      killedLetters.push(L);
      el.onmousedown = () => {
        var s = document.getElementById('kld-'+(killedRevealCount+1)); if(s && soundOn) s.play();
        var g = document.getElementById('killed-g'+killedRevealCount); if(g) g.style.opacity=1;
        killedRevealCount++; el.style.opacity=0; setTimeout(()=>el.style.display='none',1000);
      };
    });
  }

  // PHYSICS LOOP
  var mouseX=W/2, mouseY=H/2, lastX=mouseX, lastY=mouseY, mvx=0, mvy=0;
  window.onmousemove = e => { mouseX=e.clientX; mouseY=e.clientY; mvx=mouseX-lastX; mvy=mouseY-lastY; lastX=mouseX; lastY=mouseY; };
  function frame(){
    letters.forEach(L => {
      if(!L.dragging && !L.inBox){
        L.vx *= 0.98; L.vy *= 0.98; L.x += L.vx; L.y += L.vy; bounceOffBox(L);
        if(L.x<0 || L.x>W) L.vx*=-1; if(L.y<0 || L.y>H) L.vy*=-1;
        var dx=L.x-mouseX, dy=L.y-mouseY, dist=Math.sqrt(dx*dx+dy*dy);
        if(dist<100){ L.vx+=mvx*0.05; L.vy+=mvy*0.05; }
      }
      L.el.style.transform = `translate(${L.x}px,${L.y}px)`;
    });
    if(currentView==='artifact-3') killedLetters.forEach(L => { L.x+=L.vx; L.y+=L.vy; if(L.x<0||L.x>W)L.vx*=-1; if(L.y<0||L.y>H)L.vy*=-1; L.el.style.transform=`translate(${L.x}px,${L.y}px)`; });
    updatePortalState(); requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // SOUND SYSTEM
  var soundOn = false, unlocked = false, currentTrack = bgmHome;
  function switchTrack(t){ if(currentTrack===t)return; if(currentTrack)currentTrack.pause(); currentTrack=t; if(soundOn)t.play(); }
  function silenceAmbient(){ if(currentTrack)currentTrack.pause(); }
  document.getElementById('sound-toggle').onclick = () => {
    if(!unlocked){ unlocked=true; }
    soundOn = !soundOn;
    document.getElementById('sound-toggle').textContent = 'son : ' + (soundOn?'on':'off');
    if(soundOn) currentTrack.play(); else { currentTrack.pause(); stopKilledSounds(); }
  };
})();
</script>
</body>
</html>
